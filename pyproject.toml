[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionkit"
version = "0.1.0"
description = "A modular, reliable, and developer-friendly Python computer vision library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "VisionKit Contributors" }
]
keywords = [
    "computer-vision",
    "image-processing",
    "vision",
    "perception",
    "opencv",
    "numpy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.22.0",
    "opencv-python-headless>=4.5.0; sys_platform != 'win32'",
    "opencv-python>=4.5.0; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0"
]
docs = [
    "sphinx>=6.0.0",
    "furo>=2023.0.0",
    "myst-parser>=1.0.0"
]
all = [
    "visionkit[dev,docs]"
]

[project.urls]
Homepage = "https://github.com/visionkit/visionkit"
Documentation = "https://visionkit.readthedocs.io"
Repository = "https://github.com/visionkit/visionkit.git"
Issues = "https://github.com/visionkit/visionkit/issues"
Changelog = "https://github.com/visionkit/visionkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
